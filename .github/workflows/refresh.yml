name: Refresh jobs

on:
  schedule:
    # 06:00 IST = 00:30 UTC, daily
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Resolves any newly-pasted names in data/seeds.csv into registry
      # entries. Time-boxed per SPEC.md; a failure here must not block the
      # refresh, so it never fails the run.
      - name: Discover companies from seeds
        timeout-minutes: 10
        continue-on-error: true
        run: npm run discover

      - name: Ingest jobs
        run: npm run ingest

      - name: Filter jobs
        run: npm run filter

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/jobs.json data/companies.json; then
            echo "No changes to data files"
            exit 0
          fi

          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/jobs.json')).jobs.length)")
          COMPANIES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/companies.json')).length)")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/companies.json
          git commit -m "chore: refresh jobs ($COUNT jobs, $COMPANIES companies)"
          git push
