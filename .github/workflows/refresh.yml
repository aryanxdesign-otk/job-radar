name: Refresh jobs

on:
  schedule:
    # 06:00 IST = 00:30 UTC, daily
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Ingest jobs
        run: npm run ingest

      - name: Filter jobs
        run: npm run filter

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "No changes to data/jobs.json"
            exit 0
          fi

          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/jobs.json')).jobs.length)")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: refresh jobs ($COUNT total)"
          git push
