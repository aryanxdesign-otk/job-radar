name: Refresh jobs

on:
  schedule:
    # 06:00 IST = 00:30 UTC, daily
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ingest walks every company board at 1 req/sec per provider, so this
    # grows with the registry. Headroom here is cheaper than a run that dies
    # halfway and commits nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Resolves any newly-pasted names in data/seeds.csv into registry
      # entries. Time-boxed per SPEC.md; a failure here must not block the
      # refresh, so it never fails the run.
      - name: Discover companies from seeds
        timeout-minutes: 10
        continue-on-error: true
        run: npm run discover

      - name: Ingest jobs
        run: npm run ingest

      - name: Filter jobs
        run: npm run filter

      # Every run rewrites generatedAt/filteredAt and the registry's
      # lastSeenJobsAt, so `git diff` is never empty and would commit daily
      # even when the listings are identical. Compare the job set itself.
      - name: Commit and push if the listings changed
        run: |
          CHANGED=$(node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const ids = (o) => (o && o.jobs ? o.jobs.map(j => j.id).sort().join('|') : null);
            const now = ids(JSON.parse(fs.readFileSync('data/jobs.json', 'utf8')));
            let before = null;
            try { before = ids(JSON.parse(execSync('git show HEAD:data/jobs.json').toString())); } catch {}
            console.log(now === before ? 'no' : 'yes');
          ")

          if [ "$CHANGED" = "no" ]; then
            echo "Same listings as the last commit — nothing to publish."
            exit 0
          fi

          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/jobs.json')).jobs.length)")
          COMPANIES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/companies.json')).length)")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/companies.json data/first-seen.json
          git commit -m "chore: refresh jobs ($COUNT jobs, $COMPANIES companies)"
          git push
